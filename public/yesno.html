<!doctype html>
<html>

<head>
  <meta charset="windows-1251">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <!-- ������ ��� ����������, �������� ����������� �������� �������������� � ������� -->
  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@0.12.0/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.13.1/lodash.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
    integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
    crossorigin="anonymous"></script>
</head>

<body>
  <div id="app">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <p class="text-center">����� ���� �������������� ������:</p>
          <p><input v-model="question" style="width: 100%"></p>
          <div class="col-3"></div>
          <p class="text-center">{{ answer }}</p>
          <p></p>
          <p><img v-bind:src="answer_src" width="100%"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    var vue = new Vue({
      el: '#app',
      data: {
        question: '',
        answer: '���� �� �� ������ ������, � �� ���� ��������!',
        answer_src: ''
      },
      watch: {
        // ��� ������� ����������� ��� ����� ��������� �������
        question: function (newQuestion, oldQuestion) {
          this.answer = '������, ����� �� ��������� ��������...'
          this.answer_src = ""
          this.debouncedGetAnswer()
        }
      },
      created: function () {
        // _.debounce � ��� ������� �� lodash, ����������� ����������
        // ��, ��������� ����� ����� ����������� ����������� ��������.
        // � ������ ������ �� ����� ���������� ������� ��������� � yesno.wtf/api,
        // ��������� ���������� ������ ������� ����� ��� ��� ������� ajax-������.
        // ����� ������ ������ � ������� _.debounce (� � ������������ _.throttle),
        // ��. ������������: https://lodash.com/docs#debounce
        this.debouncedGetAnswer = _.debounce(this.getAnswer, 1500)
      },
      methods: {
        getAnswer: function () {
          if (this.question.indexOf('?') === -1) {
            this.answer = '������� ������ ������������� �������������� ������ ;-)'
            return
          }
          this.answer = '�����...'
          vm = this
          axios.get('https://yesno.wtf/api')
            .then(function (response) {
              vm.answer = _.capitalize(response.data.answer)
              vm.answer_src = _.capitalize(response.data.image)
            })
            .catch(function (error) {
              vm.answer = '������! �� ���� ��������� � API. ' + error
              vm.answer_src = ""

            })
        }
      }

    })
  </script>

</body>

</html>
