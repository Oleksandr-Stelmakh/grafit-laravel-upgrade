<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/lodash@4.13.1/lodash.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/axios@0.12.0/dist/axios.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

  <style>
    #app form {
      width: 300px;
      margin: auto;
    }
      @media (max-width: 767px) {
        html {
          font-size: 125%;
        }
        #app form {
          width: 100%;
        }
      }
      span.success {
        font-weight: bold;
        color: green;
      }
      span.wrong {
        font-weight: bold;
        color: red;
      }
    </style>

</head>
<body>
<div id="app">
  <form class="form-inline p-3" onsubmit="return false">
    <h1 class="mt-5 mb-5">Задачка:</h1>
    <div class="form-group">
      <span>{{ num1 }} : {{ num2 }} = </span>
      <input id="inputResult" v-model.number="result" style="width: 50px; margin: 0 5px 0 5px;">
      <span v-bind:class="answer_status" style="display: inline-block; width:80px">{{ answer }}</span>
      <button type="button" class="btn btn-primary" @click="checkResult" v-bind:disabled="!(result)" v-if="!(answer_status=='success')">Проверить</button>
      <button type="button" class="btn btn-secondary" @click="reset" v-if="(answer_status=='success')">Дальше...</button>
    </div>
    <p class="mt-3">Правильно: <span class="success">{{ count_yes }}</span>, Неправильно: <span class="wrong">{{ count_no }}</span></p>
    <p><img v-bind:src="src" width="100%"></p>
  </form>
  <h1 class="text-center m-3">{{ congratulations }}</h1>
  </div>
</div>

<script>
var vue = new Vue({
  el: '#app',
  data: {
    num1: '',
    num2: '',
    result: '',
    verify_result: '',
    answer: '',
    answer_status: '',
    count_yes: 0,
    count_no: 0,
    congratulations: '',
    srcs: [
      'https://media2.giphy.com/media/jGw3fwz5GD6GQ/giphy.gif',
      'https://media0.giphy.com/media/SRO0ZwmImic0/giphy.gif',
      'https://media0.giphy.com/media/2HFBvKS9zmkEw/200w.gif',
      'https://media2.giphy.com/media/3ztiZa4eICWGs/200w.gif',
      'https://media0.giphy.com/media/d0SEajOmMna1i/200.gif',
      'https://media1.giphy.com/media/y8Mz1yj13s3kI/200.gif',
      'https://media3.giphy.com/media/dkGhBWE3SyzXW/200.gif',
      'https://media0.giphy.com/media/xHMIDAy1qkzNS/giphy.gif',
      'https://media2.giphy.com/media/Q1D2YJnWHX20w/200.gif',
      'https://media0.giphy.com/media/2aFQHHjRcJRh1dX74H/200w.gif',
      'https://media2.giphy.com/media/Hc8PMCBjo9BXa/200w.gif',
      'https://media0.giphy.com/media/yoJC2K0lGPtQ5icNHO/200w.gif',
      'https://media0.giphy.com/media/l41lUjUgLLwWrz20w/200w.gif',
      'https://media0.giphy.com/media/Ve20ojrMWiTo4/200w.gif',
      'https://media3.giphy.com/media/eudwwfFbNyYUw/giphy.gif',
      'https://media3.giphy.com/media/11jK7UMYJ8xnjO/200.gif',
      'https://media2.giphy.com/media/xT1XGCpi6pKLCQlSr6/200w.gif',
      'https://media1.giphy.com/media/u6fpRRz8m94vm/200w.gif',
      'https://media0.giphy.com/media/Wiv9wVaAhNTO0/200.gif'
    ],
    src: ''
  },

  created: function () {
    this.reset()
  },

  methods: {
    checkResult: function () {
      if (this.result.length== 0) {
        this.answer = 'Отвечай!'
        this.answer_status = ""
        return
       }

      if(this.result == this.verify_result) {
        this.answer = "Да!"
        this.answer_status = "success"
        this.count_yes += 1
      } else {
        this.answer = "Нет :("
        this.answer_status = "wrong"
        this.count_no += 1
      }

      if ((this.count_yes == 16) && (!this.congratulations)) {
        this.congratulations = "Вот это да! Ты меня удивил. И таблицу деления тоже значешь???"
        this.src = this.srcs[this.randomNum(0, this.srcs.length)]
      }
      else if ((this.count_no == 1) && (!this.congratulations)) {
        this.congratulations = "Че-е-е-а???"
        this.src = 'https://media.giphy.com/media/nFn51VmBlX6W4/giphy.gif'
      }
    },

    randomNum: function (min, max) {
      var rand = min - 0.5 + Math.random() * (max - min + 1)
      rand = Math.round(rand);
      return rand;
    },

    reset: function () {

      a = this.randomNum(3, 9);
      b = this.randomNum(3, 9);
      c = a * b;

      this.num1 = '' + c;
      this.num2 = '' + b;
      this.result = ''
      this.verify_result = '' + a
      this.answer = ''
      this.answer_status = ''
      this.src = ''
      document.getElementById("inputResult").focus()
    },

  }

})
</script>

</body>
</html>
